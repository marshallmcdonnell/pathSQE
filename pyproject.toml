[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pathSQE"
version = "0.1.0"
description = "pathSQE: Automated analysis of single-crystal inelastic neutron scattering data"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "Aiden Sable"}
]
keywords = ["neutron", "scattering", "inelastic", "crystallography"]

dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "h5py",
    "seekpath",
    "phonopy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[project.scripts]
pathSQE-driver = "pathSQE.pathSQE_driver:main"
replot-path = "pathSQE.replot_path:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["pathSQE"]

[tool.setuptools.package-data]
pathSQE = ["ScattLengths.txt"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']

[tool.isort]
profile = "black"
line_length = 100
