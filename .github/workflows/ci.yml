name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up pixi
      uses: prefix-dev/setup-pixi@v0.7.0

    - name: Install dependencies with pixi
      run: pixi install -e dev

    - name: Lint and format check with ruff
      run: pixi run -e dev ruff check src/ tests/

    - name: Format check with ruff
      run: pixi run -e dev ruff format --check src/ tests/

  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up pixi
      uses: prefix-dev/setup-pixi@v0.7.0

    - name: Install dependencies with pixi
      run: pixi install -e dev

    - name: Run unit tests
      run: pixi run -e dev pytest tests/unit/ -v

    - name: Run integration tests
      run: pixi run -e dev pytest tests/integration/ -v
